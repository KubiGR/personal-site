<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal Site</title>
  <meta name="description" content="Projects and skills" />
  <link rel="icon" href="favicon.svg?v=1" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <style>
    :root {
      --bg: #fbfaf7;
      --surface: #ffffff;
      --text: #1c1b19;
      --muted: #6b6862;
      --faint: #9a968e;
      --line: #e7e4dd;
      --accent: #2f5d50;
      --accent-soft: #e5efeb;
      --accent-line: rgba(47, 93, 80, .35);
      --grid-dot: rgba(28, 27, 25, .09);
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
      --shadow-hover: 0 2px 4px rgba(0,0,0,.05), 0 12px 28px rgba(0,0,0,.08);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #131413;
        --surface: #1b1d1c;
        --text: #ecebe7;
        --muted: #a09d96;
        --faint: #77746e;
        --line: #2c2f2d;
        --accent: #8cc7b3;
        --accent-soft: #1f2e29;
        --accent-line: rgba(140, 199, 179, .35);
        --grid-dot: rgba(236, 235, 231, .07);
        --shadow: none;
        --shadow-hover: 0 12px 28px rgba(0,0,0,.35);
      }
    }
    :root[data-theme="dark"] {
      --bg: #131413;
      --surface: #1b1d1c;
      --text: #ecebe7;
      --muted: #a09d96;
      --faint: #77746e;
      --line: #2c2f2d;
      --accent: #8cc7b3;
      --accent-soft: #1f2e29;
      --accent-line: rgba(140, 199, 179, .35);
      --grid-dot: rgba(236, 235, 231, .07);
      --shadow: none;
      --shadow-hover: 0 12px 28px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 Inter, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: clip;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font: inherit; color: inherit; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
    .i { width: 16px; height: 16px; flex-shrink: 0; display: block; }
    .i-sm { width: 15px; height: 15px; }

    /* Tooltips: any element with data-tip */
    [data-tip] { position: relative; }
    [data-tip]::after {
      content: attr(data-tip);
      position: absolute; bottom: calc(100% + 8px); left: 50%;
      transform: translate(-50%, 4px);
      background: var(--text); color: var(--bg);
      font: 500 12px/1.4 Inter, sans-serif; padding: 5px 9px; border-radius: 6px;
      white-space: nowrap; opacity: 0; pointer-events: none;
      transition: opacity .15s ease, transform .15s ease; z-index: 20;
    }
    [data-tip]:hover::after, [data-tip]:focus-visible::after, [data-tip].tip-on::after {
      opacity: 1; transform: translate(-50%, 0);
    }

    /* Nav */
    nav {
      position: sticky; top: 0; z-index: 10;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; gap: 12px; }
    .brand { font-weight: 600; color: var(--text); }
    .brand:hover { text-decoration: none; }
    .nav-links { display: flex; gap: 18px; align-items: center; font-size: 14px; }
    .nav-links a { color: var(--muted); }
    .nav-links a:hover { color: var(--text); text-decoration: none; }
    .nav-tools { display: flex; gap: 8px; align-items: center; }
    .icon-btn {
      background: none; border: 1px solid var(--line); color: var(--muted);
      border-radius: 8px; height: 32px; min-width: 32px; padding: 0 8px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      transition: color .15s ease, border-color .15s ease;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--muted); }
    .kbd-btn { font-size: 12px; font-weight: 500; letter-spacing: .02em; }
    .theme-icon-dark { display: none; }
    :root.is-dark .theme-icon-dark { display: block; }
    :root.is-dark .theme-icon-light { display: none; }

    /* Hero */
    header.hero { position: relative; padding: 72px 0 40px; }
    header.hero::before {
      content: ""; position: absolute; z-index: -1;
      top: -56px; bottom: 0; left: 50%; width: 100vw; transform: translateX(-50%);
      background-image: radial-gradient(var(--grid-dot) 1px, transparent 1.3px);
      background-size: 22px 22px;
      -webkit-mask-image: linear-gradient(to bottom, #000 35%, transparent 100%);
              mask-image: linear-gradient(to bottom, #000 35%, transparent 100%);
      pointer-events: none;
    }
    .hero-row { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
    .avatar-wrap { position: relative; flex-shrink: 0; width: 112px; height: 112px; }
    .avatar {
      width: 112px; height: 112px; border-radius: 50%; object-fit: cover; display: grid; place-items: center;
      background: var(--accent-soft); color: var(--accent); font: 600 36px Fraunces, serif;
    }
    .status {
      position: absolute; right: 6px; bottom: 6px; width: 16px; height: 16px; border-radius: 50%;
      background: var(--accent); border: 2px solid var(--bg); cursor: default; padding: 0;
    }
    .status::before {
      content: ""; position: absolute; inset: -2px; border-radius: 50%; background: var(--accent);
      opacity: .45; animation: ping 2.6s cubic-bezier(0, 0, .2, 1) infinite;
    }
    @keyframes ping { 75%, 100% { transform: scale(2.1); opacity: 0; } }
    .status[data-tip]::after {
      left: calc(100% + 10px); bottom: auto; top: 50%; transform: translate(-4px, -50%);
      white-space: normal; width: max-content; max-width: 240px;
    }
    .status[data-tip]:hover::after, .status[data-tip]:focus-visible::after { transform: translate(0, -50%); }
    h1 { font: 600 clamp(32px, 6vw, 46px)/1.1 Fraunces, Georgia, serif; margin: 0 0 6px; letter-spacing: -.01em; }
    .role { color: var(--muted); font-size: 18px; margin: 0; }
    .bio { font-size: 17px; max-width: 640px; margin: 24px 0; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 500;
      border: 1px solid var(--line); color: var(--text); background: var(--surface);
      transition: border-color .2s ease, background-color .2s ease;
    }
    .btn:hover { text-decoration: none; border-color: var(--muted); }
    .btn .i { transition: transform .2s ease-out; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .btn.primary:hover .i { transform: translate(2px, -2px); }

    /* Sections */
    section { padding: 40px 0; border-top: 1px solid var(--line); scroll-margin-top: 56px; }
    h2 {
      display: flex; align-items: center; gap: 8px;
      font: 600 13px Inter, sans-serif; text-transform: uppercase; letter-spacing: .12em;
      color: var(--muted); margin: 0 0 24px;
    }
    h2 .i { color: var(--faint); }

    /* Projects */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
    .card {
      display: flex; flex-direction: column;
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      overflow: hidden; box-shadow: var(--shadow); color: var(--text);
      transition: transform .3s ease-out, border-color .3s ease-out, box-shadow .3s ease-out, opacity .3s ease-out;
    }
    .card:hover, .card.match { border-color: var(--accent-line); }
    a.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); text-decoration: none; }
    .grid.filtering .card:not(.match) { opacity: .6; }
    .grid.filtering .card.match { box-shadow: var(--shadow-hover); }
    .card-media { aspect-ratio: 16/9; overflow: hidden; background: var(--accent-soft); border-bottom: 1px solid var(--line); }
    .card-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s ease-out; }
    .card:hover .card-img { transform: scale(1.03); }
    .card-img.placeholder { display: grid; place-items: center; color: var(--accent); font: 600 28px Fraunces, serif; }
    .card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .card h3 { margin: 0; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .card h3 .kind { color: var(--accent); }
    .card h3 .arrow { margin-left: auto; color: var(--muted); transition: transform .3s ease-out, color .3s ease-out; }
    .card:hover h3 .arrow { transform: translate(2px, -2px); color: var(--accent); }
    .card p { margin: 0; color: var(--muted); font-size: 14.5px; flex: 1; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .tag {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
      border: 1px solid transparent; transition: border-color .2s ease, background-color .2s ease;
    }
    .invite {
      font-size: 13px; line-height: 1.5; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 6px;
    }
    .invite > .i { display: inline-block; vertical-align: -2px; margin-right: 5px; color: var(--accent); width: 14px; height: 14px; }
    .request {
      display: flex; width: fit-content; margin-top: 4px; align-items: center; gap: 4px;
      color: var(--accent); font-weight: 500; cursor: pointer; white-space: nowrap;
    }
    .request .i { transition: transform .2s ease-out; }
    .source, .verify {
      display: inline-flex; width: fit-content; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer;
      transition: color .2s ease;
    }
    .source { margin-top: 2px; }
    .source:hover, .source:focus-visible, .verify:hover { color: var(--accent); text-decoration: none; outline: none; }
    .source .i-sm, .verify .i-sm { width: 13px; height: 13px; transition: transform .2s ease-out; }
    .source:hover .i-sm, .verify:hover .i-sm { transform: translate(2px, -2px); }
    .verify { gap: 3px; margin-left: 4px; font-size: 12px; }
    .request:hover .i { transform: translateX(3px); }

    /* Skills */
    .skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .skill-row {
      display: flex; flex-direction: column; gap: 12px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 18px;
      box-shadow: var(--shadow);
    }
    .skill-row.wide { grid-column: 1 / -1; }
    .skill-row .label { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 14px; font-weight: 600; }
    .skill-row .label .i { color: var(--accent); }
    .skill-row .tags { margin-top: 0; gap: 7px; }
    .tag.skill { gap: 6px; padding: 3px 10px; font-size: 12.5px; background: transparent; border-color: var(--line); color: var(--text); }
    .tag.skill .i-pill { width: 12px; height: 12px; color: var(--muted); }
    .tag.skill.linked { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
    .tag.skill.linked .i-pill { color: var(--accent); }
    button.tag { cursor: pointer; font-family: inherit; }
    button.tag:hover, button.tag:focus-visible, button.tag[aria-pressed="true"] { border-color: var(--accent-line); outline: none; }
    button.tag[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 22%, var(--accent-soft)); }
    .tag.cert { gap: 6px; padding: 3px 10px; font-size: 12.5px; background: transparent; border-color: var(--line); color: var(--text); }
    .tag.cert .i { width: 13px; height: 13px; color: var(--accent); }
    .spoken { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; padding-top: 1px; }
    .spoken span { color: var(--text); }
    .spoken em { font-style: normal; color: var(--muted); }
    .skills-hint { margin: 18px 0 0; font-size: 13px; color: var(--faint); }

    /* Footer */
    footer { padding: 32px 0 48px; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); }
    footer .wrap { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .email-row { display: inline-flex; align-items: center; gap: 6px; }
    .copy-btn {
      background: none; border: 1px solid transparent; border-radius: 6px; padding: 4px; cursor: pointer;
      color: var(--muted); display: inline-flex; transition: color .15s ease, border-color .15s ease;
    }
    .copy-btn:hover { color: var(--text); border-color: var(--line); }
    .copy-btn .i-check { display: none; color: var(--accent); }
    .copy-btn.copied .i-check { display: block; }
    .copy-btn.copied .i-copy { display: none; }

    /* Command palette */
    dialog.palette {
      width: min(560px, calc(100% - 32px)); margin: 14vh auto auto; padding: 0;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.35);
    }
    dialog.palette::backdrop { background: rgba(10, 10, 10, .45); backdrop-filter: blur(2px); }
    .palette-search { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); color: var(--muted); }
    .palette-search input {
      flex: 1; border: 0; outline: none; background: none; color: var(--text); font: inherit; font-size: 15px;
    }
    .palette-list { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow-y: auto; }
    .palette-list li {
      display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px;
      font-size: 14px; cursor: pointer; color: var(--text);
    }
    .palette-list li .i { color: var(--muted); }
    .palette-list li .hint { margin-left: auto; font-size: 12px; color: var(--faint); }
    .palette-list li.active { background: var(--accent-soft); }
    .palette-list li.active .i { color: var(--accent); }
    .palette-empty { padding: 18px; text-align: center; color: var(--muted); font-size: 14px; }

    @media (max-width: 600px) {
      header.hero { padding-top: 44px; }
      .skills { grid-template-columns: 1fr; }
      .nav-links > a { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="wrap">
      <a class="brand" href="#top" id="brand"></a>
      <div class="nav-links">
        <a href="#projects">Projects</a>
        <a href="#skills">Skills</a>
        <div class="nav-tools">
          <button class="icon-btn kbd-btn" id="palette-btn" title="Quick actions" aria-label="Open quick actions"></button>
          <button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle theme"></button>
        </div>
      </div>
    </div>
  </nav>

  <main class="wrap" id="top">
    <header class="hero">
      <div class="hero-row">
        <div class="avatar-wrap" id="avatar"></div>
        <div>
          <h1 id="name"></h1>
          <p class="role" id="role"></p>
        </div>
      </div>
      <p class="bio" id="bio"></p>
      <div class="actions" id="actions"></div>
    </header>

    <section id="projects"><h2 id="projects-h"></h2><div class="grid" id="project-grid"></div></section>
    <section id="skills"><h2 id="skills-h"></h2><div class="skills" id="skill-list"></div><p class="skills-hint" id="skills-hint"></p></section>
  </main>

  <footer>
    <div class="wrap">
      <span id="copyright"></span>
      <span id="footer-links"></span>
    </div>
  </footer>

  <dialog class="palette" id="palette" aria-label="Quick actions">
    <div class="palette-search" id="palette-search"></div>
    <ul class="palette-list" id="palette-list" role="listbox"></ul>
  </dialog>

    };
    const wide = new Set(["Practices"]);
    const projectTags = new Set((c.projects || []).flatMap((p) => (p.tags || []).map(norm)));
    const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
    $("skill-list").innerHTML = Object.entries(c.skills || {}).map(([label, items]) => {
      let body;
      if (label === "Spoken") {
        body = `<div class="spoken">${items.map((s) => {
          const m = s.match(/^(.+?)\s*\((.+)\)$/);
          return m ? `<span>${esc(m[1])} <em>· ${esc(cap(m[2]))}</em></span>` : `<span>${esc(s)}</span>`;
        }).join("")}</div>`;
      } else if (label === "Certifications") {
        const v = c.certificationsLink;
        body = `<div class="tags">${items.map((s) => `<span class="tag cert">${icon("badge-check")}${esc(s)}</span>`).join("")}${v ? `<a class="verify" href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.label)}${icon("arrow-up-right", "i-sm")}</a>` : ""}</div>`;
      } else {
        body = `<div class="tags">${items.map((s) => {
          const t = pillText(s);
          return projectTags.has(norm(s))
            ? `<button type="button" class="tag skill linked" data-skill="${esc(norm(s))}" aria-pressed="false">${pillIcon(s)}${t.text}</button>`
            : `<span class="tag skill"${t.tip}${t.tip ? ' tabindex="0"' : ""}>${pillIcon(s)}${t.text}</span>`;
        }).join("")}</div>`;
      }
      return `<div class="skill-row${wide.has(label) ? " wide" : ""}"><div class="label">${icon(skillIcons[label] || "")}${esc(label)}</div>${body}</div>`;
    }).join("");

    // Skill → project cross-highlighting (hover previews, click pins)
    const grid = $("project-grid");
    const cards = [...grid.querySelectorAll(".card")];
    const skillBtns = [...document.querySelectorAll("button[data-skill]")];
    let pinned = null;
    const highlight = (skill) => {
      grid.classList.toggle("filtering", !!skill);
      cards.forEach((card) => card.classList.toggle("match", !!skill && card.dataset.tags.split("|").includes(skill)));
    };
    skillBtns.forEach((b) => {
      b.addEventListener("mouseenter", () => highlight(b.dataset.skill));
      b.addEventListener("focus", () => highlight(b.dataset.skill));
      b.addEventListener("mouseleave", () => highlight(pinned));
      b.addEventListener("blur", () => highlight(pinned));
      b.addEventListener("click", () => {
        pinned = pinned === b.dataset.skill ? null : b.dataset.skill;
        skillBtns.forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.skill === pinned)));
        highlight(pinned);
      });
    });
    if (skillBtns.length) $("skills-hint").textContent = "Green skills are used in the projects above. Hover or click one to see where.";

    // Hide empty sections
    ["projects", "skills"].forEach((id) => {
      const s = $(id);
      if (!s.querySelector(".card, .skill-row")) s.style.display = "none";
    });

    // Copy email
    const copyEmail = async (btn) => {
      try { await navigator.clipboard.writeText(c.email); }
      catch {
        const t = document.createElement("textarea"); t.value = c.email; document.body.appendChild(t);
        t.select(); document.execCommand("copy"); t.remove();
      }
      if (!btn) return;
      btn.classList.add("copied", "tip-on"); btn.dataset.tip = "Copied!";
      clearTimeout(btn._t);
      btn._t = setTimeout(() => { btn.classList.remove("copied", "tip-on"); btn.dataset.tip = "Copy email"; }, 2000);
    };

    $("copyright").textContent = `© ${new Date().getFullYear()} ${c.name}`;
    if (c.email) {
      $("footer-links").innerHTML = `<span class="email-row"><a href="mailto:${esc(c.email)}">${esc(c.email)}</a>
        <button class="copy-btn" id="copy-email" type="button" data-tip="Copy email" aria-label="Copy email address">${icon("copy", "i-sm i-copy")}${icon("check", "i-sm i-check")}</button></span>`;
      $("copy-email").addEventListener("click", (e) => copyEmail(e.currentTarget));
    }

    // Theme toggle (remembered per browser)
    const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    const syncTheme = () => root.classList.toggle("is-dark", isDark());
    $("theme").innerHTML = icon("moon", "theme-icon-light") + icon("sun", "theme-icon-dark");
    const toggleTheme = () => {
      root.dataset.theme = isDark() ? "light" : "dark";
      try { localStorage.setItem("theme", root.dataset.theme); } catch {}
      syncTheme();
    };
    $("theme").onclick = toggleTheme;
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncTheme);
    syncTheme();

    // Command palette (⌘K / Ctrl+K)
    const palette = $("palette"), list = $("palette-list");
    $("palette-btn").textContent = isMac ? "⌘K" : "Ctrl K";
    $("palette-search").innerHTML = `${icon("search")}<input id="palette-input" type="text" placeholder="Type a command…" autocomplete="off" aria-label="Search actions">`;
    const input = $("palette-input");
    const jump = (id) => document.getElementById(id).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    const commands = [
      c.email && { label: "Copy email", hint: c.email, icon: "copy", run: () => copyEmail($("copy-email")) },
      { label: "Jump to Projects", icon: "folder-git-2", run: () => jump("projects") },
      { label: "Jump to Skills", icon: "cpu", run: () => jump("skills") },
      ...(c.links || []).map((l) => ({ label: `Open ${l.label}`, hint: l.url.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""), icon: linkIcon(l), run: () => window.open(l.url, "_blank", "noopener") })),
      ...(c.projects || []).filter((p) => p.repo).map((p) => ({ label: `View ${p.title} source`, hint: "GitHub", icon: "github", run: () => window.open(p.repo, "_blank", "noopener") })),
      ...(c.email ? (c.projects || []).filter((p) => p.inviteOnly).map((p) => ({ label: `Request access to ${p.title}`, icon: "lock", run: () => { location.href = requestMail(p); } })) : []),
      { label: "Toggle dark / light theme", icon: "moon", run: toggleTheme },
    ].filter(Boolean);
    let shown = [], active = 0;
    const draw = () => {
      const q = norm(input.value);
      shown = commands.filter((cmd) => norm(cmd.label + " " + (cmd.hint || "")).includes(q));
      active = Math.min(active, Math.max(shown.length - 1, 0));
      list.innerHTML = shown.length
        ? shown.map((cmd, i) => `<li role="option" data-i="${i}" class="${i === active ? "active" : ""}" aria-selected="${i === active}">${icon(cmd.icon)}<span>${esc(cmd.label)}</span>${cmd.hint ? `<span class="hint">${esc(cmd.hint)}</span>` : ""}</li>`).join("")
        : `<li class="palette-empty">No matching actions</li>`;
      list.querySelector(".active")?.scrollIntoView({ block: "nearest" });
    };
    const runAt = (i) => { const cmd = shown[i]; if (!cmd) return; palette.close(); cmd.run(); };
    const openPalette = () => { input.value = ""; active = 0; draw(); palette.showModal(); input.focus(); };
    $("palette-btn").onclick = openPalette;
    input.addEventListener("input", () => { active = 0; draw(); });
    input.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { e.preventDefault(); active = (active + 1) % Math.max(shown.length, 1); draw(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); active = (active - 1 + shown.length) % Math.max(shown.length, 1); draw(); }
      else if (e.key === "Enter") { e.preventDefault(); runAt(active); }
    });
    list.addEventListener("click", (e) => { const li = e.target.closest("li[data-i]"); if (li) runAt(+li.dataset.i); });
    list.addEventListener("mousemove", (e) => { const li = e.target.closest("li[data-i]"); if (li && +li.dataset.i !== active) { active = +li.dataset.i; draw(); } });
    palette.addEventListener("click", (e) => { if (e.target === palette) palette.close(); });
    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        palette.open ? palette.close() : openPalette();
      }
    });
    }
  </script>
</body>
</html>
